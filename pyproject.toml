[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilant-robot"
version = "0.1.0"
description = "A requests-based client for downloading, uploading, and indexing Scratch projects."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "WizardStone" }]
dependencies = ["requests>=2.31"]
keywords = ["scratch", "api", "client", "projects"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Homepage = "https://github.com/WizardStone/vigilant-robot"
Repository = "https://github.com/WizardStone/vigilant-robot"
Issues = "https://github.com/WizardStone/vigilant-robot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
